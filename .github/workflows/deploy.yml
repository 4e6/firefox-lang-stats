name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # run every Sunday at 22:12 UTC
    - cron: '12 22 * * 0'

permissions:
  contents: write # the commit of data/ to main and the push to gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # a normal run (tests, append, build) takes a few minutes; this stops a hung git fetch
    # one run at a time per ref; a pull-request run never cancels or waits for a run on main
    concurrency:
      group: history-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # this repository first: its checkout cleans the workspace, which would delete firefox/
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history, needed to rebase the data commit before pushing

      # depth 1, no tags; `append` lists the remote tags and fetches each missing release tag at depth 1
      - uses: actions/checkout@v6
        with:
          repository: mozilla-firefox/firefox
          path: firefox
          persist-credentials: false # public repository, fetched anonymously

      - name: Test
        run: |
          git --version
          python3 --version
          python3 -m unittest discover -s dev

      - name: Append new releases
        run: |
          TIME=; /usr/bin/time -v true 2>/dev/null && TIME='/usr/bin/time -v' # GNU time: wall time and peak memory
          $TIME python3 dev/history.py append data/history.json --repo firefox

      - name: Build
        run: |
          TIME=; /usr/bin/time -v true 2>/dev/null && TIME='/usr/bin/time -v' # GNU time: wall time and peak memory
          mkdir build
          # data/ is not touched by this step
          $TIME python3 dev/history.py build-site data/history.json --repo firefox --out build
          cp site/index.html rustacean-orig-noshadow.ico rustacean-orig-noshadow.png build/
          # docs/methodology.md -> build/methodology.html (stdlib only; exits 1 on Markdown it does not support)
          python3 dev/render_docs.py docs/methodology.md --page site/index.html --out build/methodology.html
          python3 - <<'EOF'
          import json, os
          for f in ('index.html', 'data.json', 'methodology.html', 'rustacean-orig-noshadow.ico', 'rustacean-orig-noshadow.png'):
              assert os.path.getsize(os.path.join('build', f)) > 0, f
          assert 'href="methodology.html"' in open('build/index.html').read(), 'index.html does not link methodology.html'
          site = json.load(open('build/data.json'))
          hist = json.load(open('data/history.json'))
          assert site['releases'] == hist['releases'], 'releases differ from data/history.json'
          assert site['method_version'] == hist['method_version'] == 3, 'method_version is not 3'
          assert site['browser_excluded_prefixes'] == hist['browser_excluded_prefixes'], 'browser_excluded_prefixes differ'
          assert sorted(site['head']) == ['all', 'browser', 'date', 'sha'], 'head keys: %s' % sorted(site['head'])
          assert all(sorted(r) == ['all', 'browser', 'date', 'sha', 'tag', 'v'] for r in site['releases']), 'release keys'
          keys = ['rust', 'c', 'cpp', 'h', 'js', 'html', 'py', 'java', 'kt', 'asm']
          assert all(list(r[view]) == keys for r in site['releases'] + [site['head']] for view in ('all', 'browser')), 'language keys'
          assert [x['name'] for x in site['lang']] == ['Rust', 'C', 'C++', 'JavaScript', 'HTML', 'Python', 'Java', 'Kotlin', 'Assembly'], 'lang names'
          assert site['head']['sha'] and sum(site['head']['all'].values()) > 0, 'no head point'
          assert sum(site['head']['browser'].values()) > 0, 'empty head browser view'
          print('build/: %d releases, head %s (%s)' % (len(site['releases']), site['head']['sha'][:12], site['head']['date']))
          EOF
          ls -l build

      # only on main and never for a pull request; runs after the build, so a failed count commits nothing
      - name: Commit history
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'data/ unchanged'
          else
            git commit -m 'data: add releases'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: build # The folder the action should deploy.
