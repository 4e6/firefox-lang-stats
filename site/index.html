}
@media (prefers-color-scheme: dark) {

}

<script>
'use strict';
/* ---------- constants and state ---------- */
const LANGS = [
  { k: 'C++', name: 'C++', c: '--s1' }, { k: 'Rust', name: 'Rust', c: '--s2' }, { k: 'C', name: 'C', c: '--s3' },
  { k: 'JavaScript', name: 'JavaScript', c: '--s4' }, { k: 'HTML', name: 'HTML/CSS', c: '--s5' },
  { k: 'Python', name: 'Python', c: '--s6' }, { k: 'Java', name: 'Java', c: '--s7' }, { k: 'Assembly', name: 'Assembly', c: '--s8' }
];
const VIEWS = [
  { k: 'all', name: 'All files', long: 'All tracked files' },
  { k: 'nontest', name: 'Non-test files', long: 'Non-test files' },
  { k: 'artifact', name: 'Browser artifact', long: 'Browser artifact (Linux x86-64)' }
];
const TABS = [
  { k: 'comp', name: 'Composition', title: 'What Firefox is made of' },
  { k: 'multi', name: 'Small multiples', title: 'One chart per language' },
  { k: 'share', name: 'Language share', title: null },
  { k: 'pie', name: 'Pie', title: 'One release at a time' }
];
const RAW_KEYS = ['rust', 'c', 'h', 'cpp', 'js', 'html', 'py', 'java', 'asm'];   // only these are summed; sha and source are metadata
const st = { tab: 'comp', view: 'nontest', mode: 'share', dmode: 'share', ascale: 'share', lang: 'Rust', iso: null, sel: 0, playing: null, tableOpen: false };
let D = null;          // display data, built from data.json
let HAS = {};          // view key -> has any data

/* ---------- helpers ---------- */
const css = n => 'var(' + n + ')';
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const svgEl = (p, tag, attrs) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (p) p.appendChild(e); return e; };
const pct = d => d == null ? '–' : (d > 0 && d < 0.01 ? (d * 100).toFixed(2) : (d * 100).toFixed(1)) + '%';
const lines = n => n == null ? '–' : n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(Math.round(n));
const exact = n => n == null ? '–' : Math.round(n).toLocaleString('en-US');
const axisFmt = t => t === 0 ? '0' : d3.format('~s')(t);
const viewOf = k => VIEWS.find(v => v.k === k);
const langOf = k => LANGS.find(l => l.k === k);
const notCounted = (view, k) => view === 'artifact' && k === 'Assembly';

/* ---------- data: data.json -> display structure ---------- */
function convert(b, split) {
  if (!b || typeof b !== 'object') return null;
  for (const k of RAW_KEYS) if (typeof b[k] !== 'number' || !isFinite(b[k])) return null;   // an incomplete record is a gap
  const o = { 'C++': b.cpp + b.h * split.cpp, Rust: b.rust, C: b.c + b.h * split.c, JavaScript: b.js, HTML: b.html,
              Python: b.py, Java: b.java, Assembly: b.asm };
  o.total = LANGS.reduce((a, L) => a + o[L.k], 0);
  return o.total > 0 ? o : null;
}
const artSha = a => a && typeof a === 'object' && typeof a.sha === 'string' ? a.sha : null;
function build(data) {
  if (!data || !Array.isArray(data.releases)) throw new Error('data.json has no "releases" list');
  const hs = data.header_split || {};
  const split = { c: typeof hs.c === 'number' ? hs.c : 0.185, cpp: typeof hs.cpp === 'number' ? hs.cpp : 0.815 };
  const rel = data.releases.filter(r => r && Number.isFinite(+r.v)).slice().sort((a, b) => a.v - b.v);
  const pts = rel.map(r => ({ v: +r.v, label: String(r.v), title: 'Firefox ' + r.v, date: r.date, head: false,
    asha: artSha(r.artifact), views: { all: convert(r.all, split), nontest: convert(r.nontest, split), artifact: convert(r.artifact, split) } }));
  if (data.head && typeof data.head === 'object') {
    const h = data.head;
    pts.push({ v: null, label: 'head', title: 'Head' + (h.date ? ' (' + h.date + ')' : ''), date: h.date, sha: h.sha, head: true,
      asha: artSha(h.artifact), views: { all: convert(h.all, split), nontest: convert(h.nontest, split), artifact: convert(h.artifact, split) } });
  }
  if (!pts.length) throw new Error('data.json has no releases');
  return { pts, N: pts.length, LAST: pts.length - 1, split, data };
}
const rec = (view, i) => D.pts[i].views[view];
const val = (view, k, i) => { const r = rec(view, i); return r ? r[k] : null; };
const share = (view, k, i) => { const r = rec(view, i); return r ? r[k] / r.total : null; };
const total = (view, i) => { const r = rec(view, i); return r ? r.total : null; };
const firstIdx = view => D.pts.findIndex(p => p.views[view] != null);
const lastIdx = view => { for (let i = D.LAST; i >= 0; i--) if (D.pts[i].views[view]) return i; return -1; };
const lab = i => D.pts[i].label;
const ttl = i => D.pts[i].title;
const isolated = (arr, j) => arr[j] != null && (j === 0 || arr[j - 1] == null) && (j === arr.length - 1 || arr[j + 1] == null);
const sha7 = s => (s || '').slice(0, 7);
// The head's artifact is counted at the build's own commit, usually a little older than the head commit.
const artNote = i => { const p = D.pts[i]; if (!p.head || !p.asha || !rec('artifact', i)) return null;
  return 'Browser artifact counted at the latest finished mozilla-central build, commit ' + sha7(p.asha)
    + (p.asha === p.sha ? ' (the same commit as the head).' : ' (the head is ' + sha7(p.sha) + ').'); };
const artNoteFor = (view, i) => view === 'artifact' ? artNote(i) : null;
// a point drawn as a marker: alone, or in a run of two (a two-point line is too short to see on a long axis)
const shortRun = (arr, j) => { if (arr[j] == null) return false; let a = j, b = j;
  while (a > 0 && arr[a - 1] != null) a--; while (b < arr.length - 1 && arr[b + 1] != null) b++; return b - a < 2; };
const cellVal = (view, k, i, isS) => notCounted(view, k) && rec(view, i) ? 'not counted' : isS ? pct(share(view, k, i)) : exact(val(view, k, i));

/* ---------- shared chart parts ---------- */
function xDomain(f0) { return f0 < D.LAST ? [f0, D.LAST] : [f0 - 1, f0]; }
function xAxis(svg, x, y0, W, right) {
  const [a, b] = x.domain(), lo = Math.max(0, Math.ceil(a)), span = Math.abs(x(b) - x(a)) || 1;
  const rel = []; for (let i = lo; i <= b; i++) if (!D.pts[i].head) rel.push(i);
  let ticks = [];
  for (const s of [1, 2, 5, 10, 20, 25, 50, 100]) { ticks = rel.filter(i => D.pts[i].v % s === 0); if (ticks.length <= Math.max(2, span / 48)) break; }
  if (!ticks.length && rel.length) ticks = [rel[0]];
  const hi = D.pts.findIndex(p => p.head);
  if (hi >= lo && hi <= b) { const lt = ticks[ticks.length - 1]; if (lt == null || x(hi) - x(lt) >= 40) ticks.push(hi); }
  for (const i of ticks) {
    const px = x(i), t = svgEl(svg, 'text', { x: px, y: y0, 'text-anchor': px > right - 14 ? 'end' : 'middle' });
    t.textContent = lab(i);
  }
}
function tipShow(wrap, x, y, title, rows, note) {
  let t = wrap.querySelector('.tip');
  if (!t) { t = el('div', 'tip'); wrap.appendChild(t); }
  t.textContent = '';
  t.appendChild(el('div', 't', title));
  for (const r of rows) {
    const row = el('div', 'r');
    const k = el('span', 'k'); k.style.borderTopColor = r.color; if (r.dash) k.style.borderTopStyle = 'dashed';
    row.appendChild(k); row.appendChild(el('span', 'n', r.name)); row.appendChild(el('span', 'v', r.value));
    t.appendChild(row);
  }
  if (note) t.appendChild(el('div', 'nt', note));
  const w = wrap.clientWidth, tw = t.offsetWidth;
  t.style.left = Math.max(0, Math.min(w - tw, x + 14 > w - tw ? x - tw - 14 : x + 14)) + 'px';
  t.style.top = Math.max(0, y - 20) + 'px';
}
function tipHide(wrap) { const t = wrap.querySelector('.tip'); if (t) t.remove(); }
function idxFrom(svg, x, W, e, lo) {
  const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
  return Math.max(Math.max(0, lo), Math.min(D.LAST, Math.round(x.invert(px))));
}
function crosshairKeys(svg, lo, hover, leave) {
  let ki = D.LAST;
  svg.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') ki = Math.max(lo, ki - 1); else if (e.key === 'ArrowRight') ki = Math.min(D.LAST, ki + 1); else return;
    e.preventDefault(); hover(ki);
  });
  svg.addEventListener('blur', leave);
}

/* ---------- controls ---------- */
function seg(label, opts, cur, on) {
  const g = el('div', 'ctl');
  if (label) g.appendChild(el('span', 'lab', label));
  const s = el('div', 'seg'); s.setAttribute('role', 'group'); s.setAttribute('aria-label', label || 'options');
  for (const o of opts) {
    const b = el('button', null, o.name); b.type = 'button'; b.setAttribute('aria-pressed', String(o.k === cur));
    if (o.disabled) { b.disabled = true; b.title = o.why || ''; }
    else if (o.title) b.title = o.title;
    b.onclick = () => on(o.k); s.appendChild(b);
  }
  g.appendChild(s); return g;
}
const viewSeg = () => { const g = seg('View', VIEWS.map(v => ({ k: v.k, name: v.name, title: v.long,
  disabled: !HAS[v.k], why: 'No browser-artifact data yet' })), st.view, k => { st.view = k; render(); }); helpButton(g); return g; };

/* ---------- the (?) next to the view switch: what the three views count ---------- */

}

/* ---------- data tables: every value reachable without hovering ---------- */
function details(summary, buildTable, note) {
  const d = el('details', 'dsum'); d.open = st.tableOpen; d.addEventListener('toggle', () => { st.tableOpen = d.open; });
  d.appendChild(el('summary', null, summary));
  const sc = el('div', 'scroll'), t = el('table', 'data'); sc.appendChild(t); buildTable(t); d.appendChild(sc);
  if (note) d.appendChild(el('p', 'cap', note));
  return d;
}
const headArtNote = () => { const i = D.pts.findIndex(p => p.head); return i >= 0 ? artNote(i) : null; };
function viewTable(isS) {
  const v = viewOf(st.view);
  return details('Show the data as a table (' + v.long + ', ' + (isS ? 'share' : 'lines') + ')', t => {
    const hd = el('tr'); hd.appendChild(el('th', null, 'Release')); LANGS.forEach(L => hd.appendChild(el('th', null, L.name))); hd.appendChild(el('th', null, 'Total lines')); t.appendChild(hd);
    for (let i = D.LAST; i >= 0; i--) {
      const tr = el('tr'); tr.appendChild(el('td', 'mono', lab(i)));
      if (!rec(st.view, i)) { const td = el('td', 'mono gap', 'no data'); td.colSpan = LANGS.length + 1; td.style.textAlign = 'center'; tr.appendChild(td); }
      else { LANGS.forEach(L => tr.appendChild(el('td', 'mono', cellVal(st.view, L.k, i, isS)))); tr.appendChild(el('td', 'mono', exact(total(st.view, i)))); }
      t.appendChild(tr);
    }
  }, st.view === 'artifact' ? headArtNote() : null);
}
function langTable() {
  const LL = langOf(st.lang), isS = st.ascale === 'share';
  return details('Show the data as a table (' + LL.name + ', ' + (isS ? 'share' : 'lines') + ')', t => {
    const hd = el('tr'); ['Release'].concat(SERIES.map(s => s.name)).forEach(h => hd.appendChild(el('th', null, h))); t.appendChild(hd);
    for (let i = D.LAST; i >= 0; i--) {
      const tr = el('tr'); tr.appendChild(el('td', 'mono', lab(i)));
      SERIES.forEach(s => { const ok = rec(s.k, i) != null; tr.appendChild(el('td', 'mono' + (ok ? '' : ' gap'), ok ? cellVal(s.k, st.lang, i, isS) : 'no data')); });
      t.appendChild(tr);
    }
  }, headArtNote());
}

/* ---------- page ---------- */
function panel() {
  const P = document.getElementById('panel'); P.textContent = ''; help = null;
  P.setAttribute('aria-labelledby', 'tab-' + st.tab);
  const T = TABS.find(t => t.k === st.tab);
  P.appendChild(el('h2', null, st.tab === 'share' ? 'How much ' + langOf(st.lang).name + '?' : T.title));
  const c = el('div', 'controls'); P.appendChild(c);
  const host = el('div'); P.appendChild(host);
  if (st.tab === 'share') {
    c.appendChild(seg('Language', LANGS.map(l => ({ k: l.k, name: l.name })), st.lang, k => { st.lang = k; render(); }));
    c.appendChild(seg('Scale', [{ k: 'share', name: 'Share' }, { k: 'lines', name: 'Lines' }], st.ascale, k => { st.ascale = k; render(); }));
    host.appendChild(seriesKey());
    const w = el('div', 'chartwrap'); host.appendChild(w); drawLangShare(w);
    P.appendChild(langTable());
    return;
  }
  c.appendChild(viewSeg());
  if (st.tab === 'comp') {
    c.appendChild(seg('Scale', [{ k: 'share', name: 'Share' }, { k: 'lines', name: 'Lines' }], st.mode, k => { st.mode = k; render(); }));
    host.appendChild(legend(true)); const w = el('div', 'chartwrap'); host.appendChild(w); drawStack(w);
    P.appendChild(viewTable(st.mode === 'share'));
  } else if (st.tab === 'multi') {
    c.appendChild(seg('Scale', [{ k: 'share', name: 'Share' }, { k: 'lines', name: 'Lines' }], st.dmode, k => { st.dmode = k; render(); }));
    host.appendChild(legend(false)); const w = el('div'); host.appendChild(w); drawMultiples(w);
    P.appendChild(viewTable(st.dmode === 'share'));
  } else {
    const w = el('div'); pieScrubber(host, i => drawPie(w, i)); host.appendChild(w); drawPie(w, st.sel);
    P.appendChild(viewTable(true));
  }
}
function tabs() {
  const T = document.getElementById('tabs'); T.textContent = '';
  for (const t of TABS) {
    const b = el('button', 'tab', t.name); b.type = 'button'; b.id = 'tab-' + t.k; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(st.tab === t.k)); b.setAttribute('aria-controls', 'panel');
    b.onclick = () => { st.tab = t.k; st.iso = null; render(); };
    T.appendChild(b);
  }
}
function render() {
  stopPlay();
  if (!HAS[st.view]) st.view = HAS.nontest ? 'nontest' : 'all';
  tabs(); panel();
}

function fail(msg) {
  document.getElementById('tabs').textContent = '';
  const P = document.getElementById('panel'); P.textContent = '';
  const n = el('p', 'note err'); n.textContent = msg; P.appendChild(n);
  document.getElementById('title-date').textContent = '–';
}
function header() {
  const data = D.data;
  if (data.title_date) document.getElementById('title-date').textContent = data.title_date;
  if (data.meta_date) document.querySelector('meta[name="date"]').setAttribute('content', data.meta_date);
  const i = lastIdx('nontest'), j = lastIdx('all'), k = lastIdx('artifact');
  if (i >= 0) {
    const where = D.pts[i].head ? 'At the current head' : 'In ' + ttl(i);
    const parts = ['<b>' + pct(share('nontest', 'Rust', i)) + '</b> of non-test lines'];
    if (j === i) parts.push('<b>' + pct(share('all', 'Rust', j)) + '</b> of all tracked lines');
    // the head's artifact comes from the latest finished build, whose commit can differ from the head's: name it
    const ab = D.pts[k] && D.pts[k].head && /^[0-9a-f]{7,40}$/.test(D.pts[k].asha || '') ? ' (latest finished build, ' + sha7(D.pts[k].asha) + ')' : '';
    if (k === i) parts.push('<b>' + pct(share('artifact', 'Rust', k)) + '</b> of the browser artifact' + ab);
    const list = parts.length < 3 ? parts.join(' and ') : parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1];
    document.getElementById('headline').innerHTML = where + ', Rust is ' + list + '.';
  }
}

async function main() {
  if (typeof d3 === 'undefined') { fail('The chart library (d3) did not load. Check the network connection or any content blocker, then reload the page.'); return; }
  let data;
  try {
    const res = await fetch('data.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
    D = build(data);
  } catch (e) {
    fail('Could not load the data (data.json): ' + e.message + '. Try reloading the page.');
    return;
  }
  for (const v of VIEWS) HAS[v.k] = D.pts.some(p => p.views[v.k] != null);
  if (!HAS.all && !HAS.nontest) { fail('data.json contains no usable release records.'); return; }
  st.sel = D.LAST;
  header();
  render();
  // the help popover closes on Escape (focus back on its button) and on a press anywhere outside it and its button
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && help && help.open) { e.preventDefault(); setHelp(false, true); } });
  document.addEventListener('pointerdown', e => { if (help && help.open && !help.pop.contains(e.target) && !help.btn.contains(e.target)) setHelp(false); });
  let lastW = document.getElementById('panel').clientWidth, rz;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      const w = document.getElementById('panel').clientWidth;
      if (w === lastW) return;
      lastW = w;
      if (st.tab !== 'pie') panel();
    }, 150);
  });
}
main();
</script>
</body>
</html>
